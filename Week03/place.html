<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benin | Country Page</title>

    <meta name="description" content="Country page about Benin">
    <meta name="author" content="Paterne Hountondji">

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

<header>
    <h1>Benin</h1>
</header>

<main>

    <picture class="hero">
        <source srcset="images/benin-large.webp" media="(min-width: 768px)">
        <img src="images/benin-small.webp" alt="Benin Landscape">
    </picture>

    <section class="data">

        <h2>Data</h2>

        <p><strong>Capital:</strong> Porto-Novo</p>
        <p><strong>Largest City:</strong> Cotonou</p>
        <p><strong>Population:</strong> 13.7 Million</p>
        <p><strong>Area:</strong> 114,763 km²</p>
        <p><strong>Language:</strong> French</p>
        <p><strong>Currency:</strong> West African CFA Franc</p>
        <p><strong>Time Zone:</strong> UTC +1</p>

    </section>

    <section class="weather">

        <h2>Weather</h2>

        <img src="images/weather.svg.jpg" alt="Weather Icon" class="weather-icon">

        <p><strong>Temperature:</strong> <span id="temperature">28</span> °C</p>

        <p><strong>Conditions:</strong> Sunny</p>

        <p><strong>Wind:</strong> <span id="wind">10</span> km/h</p>

        <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>

    </section>

</main>

<footer>

<p>
